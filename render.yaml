services:
  - type: web
    name: evil-gpt
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: ADMIN_USERNAME
        value: "your_admin_username"
      - key: ADMIN_PASSWORD
        value: "your_secure_password"
      - key: SECRET_KEY
        generateValue: true
    plan: free
