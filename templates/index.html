<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Evil GPT</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div id="auth-view" class="auth-shell">
    <div class="auth-card">
      <a class="brand brand-large" href="#"><span class="brand-mark">E</span> EVIL GPT</a>
      <h1>Sign In</h1>
      <div class="auth-tabs"><button class="tab active" id="login-tab">Sign in</button><button class="tab" id="register-tab">Register</button></div>
      <form id="login-form"><label>Username<input id="login-username" required></label><label>Password<input id="login-password" type="password" required></label><button class="primary full">Go</button></form>
      <form id="register-form" class="hidden"><label>Username<input id="reg-username" required></label><label>Email<input id="reg-email" type="email" required></label><label>Password<input id="reg-password" type="password" minlength="10" required></label><button class="primary full">Register (Get 2-Day Trial!)</button></form>
      <p id="auth-message" class="notice"></p>
    </div>
  </div>

  <div id="app-view" class="app hidden">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#"><span class="brand-mark">E</span> EVIL GPT</a>
      <button id="new-chat" class="new-chat">＋ New chat</button>
      <nav><button class="nav-item active" data-page="chat">◈ Chat</button><button class="nav-item" data-page="plans">✦ Plans</button><button class="nav-item hidden" id="admin-nav" data-page="admin">⚙ Admin</button></nav>
      <div id="history-list" class="history-list"></div>
      <div class="sidebar-bottom">
        <div class="user-chip"><div class="avatar" id="avatar">U</div><div><strong id="side-username">User</strong><small id="side-plan">Free</small></div></div>
        <div id="user-stats-label" class="tiny muted" style="margin-top:10px;">Loading stats...</div>
        <button id="logout" class="logout">Sign out ↗</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar"><div><strong id="page-heading">AI Assistant</strong></div><div class="top-actions"><span class="plan-pill" id="top-plan">FREE</span></div></header>
      <section id="chat-page" class="page">
        <div class="welcome" id="welcome"><h1>What are we creating today?</h1></div>
        <div id="chat-messages" class="chat-messages"></div>
        <div class="composer-wrap">
          <div class="composer-tools">
            <select id="persona-select" class="persona-select"></select>
            <select id="model-select" class="persona-select"><option value="deep">🧠 Deep</option><option value="fast">⚡ Fast</option></select>
            <span class="muted tiny" id="usage-label">Loading…</span>
          </div>
          <form id="chat-form" class="composer"><textarea id="message-input" rows="1" placeholder="Message..." required></textarea><button class="send-btn">↑</button></form>
        </div>
      </section>
      <section id="plans-page" class="page hidden"><div class="section-intro"><h1>Plans</h1><div class="usage-card"><strong id="usage-number">—</strong><div class="progress"><span id="usage-progress"></span></div></div></div><div id="plans-grid" class="plans-grid"></div></section>
      <section id="admin-page" class="page hidden"><h1>Admin</h1><div id="admin-users" class="admin-card"></div></section>
    </main>
  </div>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
