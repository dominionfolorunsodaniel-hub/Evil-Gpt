<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ title }} — Evil GPT</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="share-page">
  <a class="brand" href="/" style="margin-bottom:20px"><span class="brand-mark">E</span> EVIL GPT</a>
  <h1 style="font:700 28px 'Space Grotesk'">{{ title }}</h1>
  <p class="muted tiny">Shared read-only conversation</p>
  {% for m in messages %}
  <div class="share-msg {{ m.role }}">
    <div class="role">{{ 'YOU' if m.role == 'user' else 'EVIL GPT' }}</div>
    <div class="message-body" style="white-space:pre-wrap">{{ m.content }}</div>
  </div>
  {% endfor %}
  <p style="margin-top:40px"><a href="/">Try Evil GPT →</a></p>
</div>
</body>
</html>
